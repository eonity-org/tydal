# One TYDAL installation behind the host's nginx — copy per installation, set
# the host name, the checkout path and the app port (instance.compose.yml).
#   sudo cp nginx-site.conf /etc/nginx/sites-available/tydal-pro.conf
#   sudo ln -s ../sites-available/tydal-pro.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tydal.example.org          # adds TLS + the http → https redirect
upstream tydal_pro {
    server 127.0.0.1:8100;                             # INSTANCE: its app port
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tydal.example.org;                     # INSTANCE

    root /srv/tydal-pro/src/frontend/build;            # INSTANCE
    index index.html;

    # Uploads: MAX_MEDIA_FILE_SIZE (300 MB) + multipart overhead.
    client_max_body_size 310M;

    # SPA: client-side routes fall back to index.html. Never cache the shell,
    # so a new build is picked up on the next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Hashed Vite assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Backend: REST API, public vault grammar (/vault, /h, /v), media, health.
    location ~ ^/(api|vault|h|v|storage|up)(/|$) {
        proxy_pass http://tydal_pro;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Long requests: synchronous Tika extraction, large uploads.
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_request_buffering off;
    }
}
