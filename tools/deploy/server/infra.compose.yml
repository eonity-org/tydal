# TYDAL backing services, shared by every TYDAL installation on this server.
# Lives in its own folder, e.g. /srv/tydal-infra/compose.yml, next to a .env
# (chmod 600) holding MYSQL_ROOT_PASSWORD and REDIS_PASSWORD:
#   cd /srv/tydal-infra && docker compose up -d
#
# Every port is bound to 127.0.0.1: installations reach the services by name on
# the `tydal-infra` network; the host ports are only for admin access over SSH.
# Data on a data disk (change /srv/data to yours). Each installation gets its
# own MySQL database + user, Redis prefix and Elasticsearch index prefix
# (ELASTICSEARCH_INDEX_PREFIX) — see make-env.sh. DEPLOYMENT.md, "On a server".
name: tydal-infra

services:
  mysql:
    image: mysql:8.0
    command: ["--innodb-buffer-pool-size=512M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - /srv/data/tydal-infra/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      - discovery.type=single-node
      # No auth: reachable only on the tydal-infra network and 127.0.0.1.
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms768m -Xmx768m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - /srv/data/tydal-infra/elasticsearch:/usr/share/elasticsearch/data   # owned by uid 1000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /srv/data/tydal-infra/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  tika:
    image: apache/tika:latest-full
    ports:
      - "127.0.0.1:9998:9998"
    restart: unless-stopped

networks:
  default:
    name: tydal-infra
