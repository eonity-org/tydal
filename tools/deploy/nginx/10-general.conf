# Replaces the webdevops/php-nginx image's own 10-general.conf, whose only line
# is `client_max_body_size 50m;` — that silently capped every upload at 50 MB,
# below PHP's limits. Keep this at least PHP_POST_MAX_SIZE (docker-compose.yml,
# app service); the real per-file limit is MAX_MEDIA_FILE_SIZE (backend/.env).
client_max_body_size 310m;
