# TYDAL dev/deploy stack. Two kinds of service live here:
#   • infrastructure — mysql, elasticsearch, kibana, tika, redis (+ ollama when
#     toggled on): heavy, and shareable between installations;
#   • the application — app, queue, scheduler (toggled by configure.sh for the
#     docker tier): one set per installation.
#
# Names and ports come from variables whose defaults are the historical
# literals, so with no root `.env` this file renders exactly as it always did
# (tydal_app, :8000, tydal_default, …). `tools/deploy/configure.sh` writes the
# root `.env` (Compose's project env file) when it needs other values:
#   TYDAL_STACK            container-name prefix              (default tydal)
#   TYDAL_HTTP_PORT        app host port                      (default 8000)
#   TYDAL_MYSQL_PORT / TYDAL_ES_PORT / TYDAL_KIBANA_PORT / TYDAL_TIKA_PORT /
#   TYDAL_REDIS_PORT / TYDAL_OLLAMA_PORT   infrastructure host ports (defaults
#                          3306 / 9200 / 5601 / 9998 / 6379 / 11434)
#
# Production (`configure.sh … --prod`, DEPLOYMENT.md "Production with the
# deploy scripts") sets, in the same root `.env`:
#   TYDAL_PORT_BIND=127.0.0.1:   publish every port on loopback only (nginx on
#                          the host is the way in); empty = all interfaces
#   TYDAL_MYSQL_ROOT_PASSWORD / TYDAL_MYSQL_PASSWORD / TYDAL_REDIS_PASSWORD
#                          generated secrets (dev defaults: secret / secret / none)
#   TYDAL_MYSQL_DATA / TYDAL_ES_DATA / TYDAL_REDIS_DATA   host directories
#                          (--data-dir) instead of the named volumes
#   TYDAL_STORAGE          host directory mounted as backend/storage
#   TYDAL_ES_HEAP          Elasticsearch heap (default 512m)
#   TYDAL_KIBANA_PROFILE=kibana  keeps Kibana off unless asked for
#   TYDAL_WORKER_EXEC="gosu application"  queue/scheduler run as uid 1000,
#                          not root, so the files they write stay the app's
#
# Shared infrastructure (several installations on one server, #23 —
# DEPLOYMENT.md, "Several installations on one server"):
# `configure.sh <ai> <tier> --infra=shared --name=NAME` makes this checkout use
# another checkout's running infrastructure instead of its own:
#   TYDAL_INFRA_PROFILE=infra  every infrastructure service carries
#                          `profiles: ["${TYDAL_INFRA_PROFILE:-}"]`. Empty (the
#                          default) means "no profile", so they always start,
#                          as before; set, they only start when that profile is
#                          asked for — i.e. never in a shared installation.
#   TYDAL_NETWORK / TYDAL_NETWORK_EXTERNAL=true  the project's default network
#                          becomes the infrastructure stack's network (external),
#                          so app/queue/scheduler still reach mysql,
#                          elasticsearch, redis and tika by service name.
#   TYDAL_INFRA_REQUIRED=false  the app services' depends_on entries on the
#                          infrastructure stop being required: in a shared
#                          installation those services belong to another project.

services:

  # ── MySQL ─────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ${TYDAL_STACK:-tydal}_mysql
    profiles: ["${TYDAL_INFRA_PROFILE:-}"]   # see "Shared infrastructure" above
    environment:
      MYSQL_ROOT_PASSWORD: ${TYDAL_MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: tydal
      MYSQL_USER: tydal
      MYSQL_PASSWORD: ${TYDAL_MYSQL_PASSWORD:-secret}
    ports:
      - "${TYDAL_PORT_BIND:-}${TYDAL_MYSQL_PORT:-3306}:3306"
    volumes:
      - ${TYDAL_MYSQL_DATA:-mysql_data}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Elasticsearch ────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: ${TYDAL_STACK:-tydal}_elasticsearch
    profiles: ["${TYDAL_INFRA_PROFILE:-}"]   # see "Shared infrastructure" above
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms${TYDAL_ES_HEAP:-512m} -Xmx${TYDAL_ES_HEAP:-512m}"
    ports:
      - "${TYDAL_PORT_BIND:-}${TYDAL_ES_PORT:-9200}:9200"
    volumes:
      - ${TYDAL_ES_DATA:-elasticsearch_data}:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Kibana ────────────────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.0
    container_name: ${TYDAL_STACK:-tydal}_kibana
    # Off in production (TYDAL_KIBANA_PROFILE=kibana: `docker compose --profile
    # kibana up -d kibana` starts it when needed); otherwise as the others.
    profiles: ["${TYDAL_KIBANA_PROFILE:-${TYDAL_INFRA_PROFILE:-}}"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${TYDAL_PORT_BIND:-}${TYDAL_KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ── Apache Tika ───────────────────────────────────────────────────────────────
  # Extracts text from PDF, DOCX, XLSX, PPTX, ODT, RTF, HTML, etc.
  # PHP connects via HTTP: POST /tika with the file binary → plain text response
  tika:
    image: apache/tika:latest-full
    container_name: ${TYDAL_STACK:-tydal}_tika
    profiles: ["${TYDAL_INFRA_PROFILE:-}"]   # see "Shared infrastructure" above
    ports:
      - "${TYDAL_PORT_BIND:-}${TYDAL_TIKA_PORT:-9998}:9998"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9998/tika || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama ────────────────────────────────────────────────────────────────────
  # Ollama runs NATIVELY on the host for Metal GPU acceleration on macOS.
  # Docker cannot pass through Apple's Metal GPU to containers.
  #
  # Setup (native, recommended on macOS — GPU accelerated):
  #   brew install ollama
  #   brew services start ollama        # auto-start on login
  #   ollama pull mxbai-embed-large     # embedding model — 1024-dim (matches EMBEDDING_DIMENSIONS=1024)
  #   ollama pull llama3.2              # chat model
  #   ollama pull llama3.2-vision       # vision model (needs ~11 GiB RAM)
  #   # (nomic-embed-text is 768-dim — if you use it, set EMBEDDING_DIMENSIONS=768)
  #
  # OLLAMA_HOST in .env stays http://localhost:11434 (no change needed).
  #
  # To run Ollama in Docker instead (CPU only, no GPU): uncomment the block
  # below AND the `ollama_data:` volume at the bottom of this file, then set
  # OLLAMA_HOST=http://ollama:11434 in backend/.env. Pull models with:
  # (container names below assume the default TYDAL_STACK=tydal)
  #   docker exec tydal_ollama ollama pull mxbai-embed-large
  #   docker exec tydal_ollama ollama pull llama3.2
  #   docker exec tydal_ollama ollama pull llama3.2-vision
  # `configure.sh ollama-docker docker` enables the service; `install.sh` also
  # pulls all three configured models automatically.
  #
  # >>> TYDAL-TOGGLE: ollama >>> (managed by tools/deploy/configure.sh)
#  ollama:
#    image: ollama/ollama:latest
#    container_name: ${TYDAL_STACK:-tydal}_ollama
#    profiles: ["${TYDAL_INFRA_PROFILE:-}"]
#    ports:
#      - "${TYDAL_PORT_BIND:-}${TYDAL_OLLAMA_PORT:-11434}:11434"
#    volumes:
#      - ollama_data:/root/.ollama
#    restart: unless-stopped
  # <<< TYDAL-TOGGLE: ollama <<<

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${TYDAL_STACK:-tydal}_redis
    profiles: ["${TYDAL_INFRA_PROFILE:-}"]   # see "Shared infrastructure" above
    # A password only when TYDAL_REDIS_PASSWORD is set (production). The
    # container keeps it as REDIS_PASSWORD, which the tools' redis-cli calls
    # and shared installations (configure.sh) read from here.
    environment:
      REDIS_PASSWORD: ${TYDAL_REDIS_PASSWORD:-}
    command: ["sh", "-c", "exec redis-server $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    ports:
      - "${TYDAL_PORT_BIND:-}${TYDAL_REDIS_PORT:-6379}:6379"
    volumes:
      - ${TYDAL_REDIS_DATA:-redis_data}:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+--no-auth-warning -a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── PHP + nginx (optional full-Docker backend) ────────────────────────────────
  # By default (the `host` topology) the backend runs on the host:
  #   php -d upload_max_filesize=300M -d post_max_size=310M artisan serve   (port 8000)
  #   php artisan queue:work --timeout=360                                  (queue worker)
  #   php artisan schedule:work                                             (scheduler daemon)
  # tools/deploy/start.sh launches all three. This keeps the fast edit/reload
  # loop and is the recommended dev path.
  #
  # To run the whole backend inside Docker instead, uncomment the three blocks
  # below. They use the prebuilt webdevops/php-nginx image (php-fpm + nginx +
  # all required PHP extensions baked in) — no Dockerfile or config files needed.
  # Or let `configure.sh <cloud|ollama-host|ollama-docker> docker` do it.
  #
  # The Docker app needs backend/.env pointed at the Docker network:
  #   DB_HOST=mysql   REDIS_HOST=redis   ELASTICSEARCH_HOST=http://elasticsearch:9200
  # The app is served at http://localhost:8000 (same as artisan serve;
  # TYDAL_HTTP_PORT in the root .env changes it).
  # First run (tydal_app = ${TYDAL_STACK:-tydal}_app):
  #            docker exec -it tydal_app composer install && \
  #            docker exec -it tydal_app php artisan key:generate
  #
  # >>> TYDAL-TOGGLE: docker-app >>> (managed by tools/deploy/configure.sh)
  app:
    # PHP 8.4 to match a modern host: ./backend (incl. vendor/) is bind-mounted,
    # so the container PHP must satisfy the host-installed dependencies. Bump
    # this tag if your host PHP is newer than the image.
    image: webdevops/php-nginx:8.4
    container_name: ${TYDAL_STACK:-tydal}_app
    ports:
      - "${TYDAL_PORT_BIND:-}${TYDAL_HTTP_PORT:-8000}:80"
    environment:
      WEB_DOCUMENT_ROOT: /var/www/html/public
      PHP_UPLOAD_MAX_FILESIZE: 300M
      PHP_POST_MAX_SIZE: 310M
      PHP_MEMORY_LIMIT: 512M
      PHP_DISMOD: ioncube   # not bundled in this image; silences a load warning
    volumes:
      - ./backend:/var/www/html
      # uploads, logs, caches: backend/storage, or TYDAL_STORAGE (production --data-dir)
      - ${TYDAL_STORAGE:-./backend/storage}:/var/www/html/storage
      # nginx body limit matched to PHP_POST_MAX_SIZE (the image default is 50m)
      - ./tools/deploy/nginx/10-general.conf:/opt/docker/etc/nginx/vhost.common.d/10-general.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host-side Ollama (ollama-host) on Linux
    depends_on:
      mysql:
        condition: service_healthy
        required: ${TYDAL_INFRA_REQUIRED:-true}   # false in a shared installation
      redis:
        condition: service_healthy
        required: ${TYDAL_INFRA_REQUIRED:-true}   # false in a shared installation
      elasticsearch:
        condition: service_healthy
        required: ${TYDAL_INFRA_REQUIRED:-true}   # false in a shared installation
    restart: unless-stopped
  queue:
    image: webdevops/php-nginx:8.4
    container_name: ${TYDAL_STACK:-tydal}_queue
    working_dir: /var/www/html
    command: ${TYDAL_WORKER_EXEC:-} php artisan queue:work --timeout=360
    environment:
      PHP_MEMORY_LIMIT: 512M
      PHP_DISMOD: ioncube
    volumes:
      - ./backend:/var/www/html
      - ${TYDAL_STORAGE:-./backend/storage}:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
        required: ${TYDAL_INFRA_REQUIRED:-true}   # false in a shared installation
    restart: unless-stopped
  # Scheduler daemon: runs `schedule:run` every minute, which fires the
  # maintenance jobs in bootstrap/app.php (resource:prune, files:purge-uncommitted,
  # resources:purge-drafts). Each run is a fresh PHP process, so code/.env
  # changes apply without a restart.
  scheduler:
    image: webdevops/php-nginx:8.4
    container_name: ${TYDAL_STACK:-tydal}_scheduler
    working_dir: /var/www/html
    command: ${TYDAL_WORKER_EXEC:-} php artisan schedule:work
    environment:
      PHP_MEMORY_LIMIT: 512M
      PHP_DISMOD: ioncube
    volumes:
      - ./backend:/var/www/html
      - ${TYDAL_STORAGE:-./backend/storage}:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
        required: ${TYDAL_INFRA_REQUIRED:-true}   # false in a shared installation
      redis:
        condition: service_healthy
        required: ${TYDAL_INFRA_REQUIRED:-true}   # false in a shared installation
    restart: unless-stopped
  # <<< TYDAL-TOGGLE: docker-app <<<

# The project's network. Default: Compose's own `<project>_default`, as always.
# A shared installation (configure.sh --infra=shared) points it at the network
# of the stack that runs the infrastructure and marks it external.
networks:
  default:
    name: ${TYDAL_NETWORK:-${COMPOSE_PROJECT_NAME}_default}
    external: ${TYDAL_NETWORK_EXTERNAL:-false}

volumes:
  mysql_data:
  elasticsearch_data:
  redis_data:
  # ollama_data — only used when Ollama runs in Docker; toggled with the
  # ollama service by `configure.sh ollama docker`. Native Ollama stores
  # models in ~/.ollama and needs no volume here.
  # >>> TYDAL-TOGGLE: ollama-volume >>> (managed by tools/deploy/configure.sh)
#  ollama_data:
  # <<< TYDAL-TOGGLE: ollama-volume <<<
